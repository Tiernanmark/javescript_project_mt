<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mortgage Calculator</h1>
    <div class="borrowingCalculator">
        <div>
            <p></p>
            <label>
                <input type="radio" name="buyerType" id="firstTime">
                First Time Buyer
            </label>
            <label>
                <input type="radio" name="buyerType" id="secondTime">
                Second Time Buyer
            </label>
        </div>
        <input type="number" id="annualIncome" placeholder="please enter your yearly net income">
        <button type="button" id="calculateTotalBtn">Calculate</button>
        <p id="totalBorrowing"></p>
        <p id="annualIncomeMessage"></p>
        <div id="mortgageDetails" hidden>
            <label for="irishBank">Choose Bank</label>
            <select id="irishBank">
                <option value="">Please select a bank</option>
                <option value="boi">Bank of Ireland</option>
                <option value="aib">AIB</option>
                <option value="ptsb">PTSB</option>
                <option value="ebs">EBS</option>
            </select>
            <label for="interestRate">Interest Rate</label>
            <select id="interestRate" disabled>
                <option value="">Awaiting bank selection</option>
            </select>
            <input type="number" id="termLength" placeholder="please enter term length">
            <button type="button" id="calculatePaymentsBtn">Calculate</button>
        <p id="monthlyPayments"></p>
        <p id="monthlyPaymentsMessage"></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
