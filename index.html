<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mortgage Calculator</h1>
    </header>
    <div class="borrowingCalculator">
        <div>
            <label for="buyerType">Type of Buyer</label>
            <label>
                <input type="radio" name="buyerType" id="firstTime">
                First Time Buyer
            </label>
            <label>
                <input type="radio" name="buyerType" id="secondTime">
                Second Time Buyer
            </label>
        </div>
        <label for="annualIncome">Annual Income (€)</label>
        <input type="number" id="annualIncome" placeholder="Enter yearly Gross income">
        <button type="button" id="calculateTotalBtn">Calculate</button>
        <p id="totalBorrowing"></p>
        <p id="depositMessage"></p>
        <div id="mortgageDetails" hidden>
            <label for="irishBank">Choose Bank</label>
            <select id="irishBank">
                <option value="">Please select a bank</option>
                <option value="boi">Bank of Ireland</option>
                <option value="aib">AIB</option>
                <option value="ptsb">PTSB</option>
                <option value="ebs">EBS</option>
            </select>
            <label for="interestRate">Interest Rate</label>
            <select id="interestRate" disabled>
                <option value="">Awaiting bank selection</option>
            </select>
            <label for="termLength">Term Length</label>
            <input type="number" id="termLength" placeholder="please enter term length">
            <button type="button" id="calculatePaymentsBtn">Calculate</button>
            <p id="monthlyPayments"></p>
            <p id="monthlyPaymentsMessage"></p>
        </div>
        <div id="mortgageChecklist" hidden>
            <h2>Checklist</h2>
            <ul class="task-list">
                <li>
                    <label>
                        <input type="checkbox">
                        <span>Months Current Account/s Bank Statement</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>6 Months Savings Account/s Bank Statement</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>6 Months Loan Account/s Bank Statement</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>Salary Certificate</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>An Employment Detail Summary (EDS)</span>
                        <small>Available through Revenue's myAccount service</small>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>Proven Repay Ability (PRA)</span>
                        <small>Savings/rent/Loan payments(finsihing in next 6 months) for the last 6 months</small>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>placeholder</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>placeholder</span>
                    </label>
                </li>

            </ul>
        </div>

    </div>
    <footer>Placeholder</footer>
    <script src="script.js"></script>
</body>
</html>
