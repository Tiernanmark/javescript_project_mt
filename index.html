<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mortgage Calculator</h1>
    <div class="borrowingCalculator">
        <div>
            <p></p>
            <label>
                <input type="radio" id="firstTime">
                First Time Buyer
            </label>
            <label>
                <input type="radio" id="secondTime">
                Second Time Buyer
            </label>
        </div>
        <input type="number" id="annualIncome" placeholder="please enter your yearly net income">
        <button type="button" id="calculateTotalBtn">Calculate</button>
        <p id="totalBorrowing"></p>
        <p id="annualIncomeMessage"></p>

    </div>
    <script src="script.js"></script>
</body>
</html>
